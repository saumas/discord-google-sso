apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "discord-google-sso.fullname" . }}
  labels:
    {{- include "discord-google-sso.labels" . | nindent 4 }}
rules:
  # Secret creation cannot be name-scoped by Kubernetes RBAC; only get and
  # update are restricted to the named state Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.stateSecretName }}"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "discord-google-sso.fullname" . }}
  labels:
    {{- include "discord-google-sso.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "discord-google-sso.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "discord-google-sso.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
