apiVersion: v1
kind: Service
metadata:
  name: {{ include "discord-google-sso.fullname" . }}
  labels:
    {{- include "discord-google-sso.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "discord-google-sso.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
